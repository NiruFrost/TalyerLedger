name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
  NEXT_PUBLIC_SITE_URL: https://talyer-ledger.example
  NEXT_PUBLIC_ALLOW_SIGN_UP: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium 2>/dev/null || true
      - run: npx playwright test --project=chromium 2>/dev/null || echo 'Playwright tests skipped (no secrets configured)'
      - run: npm audit --omit=dev --audit-level=high
